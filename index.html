<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sira AI">
  <link rel="apple-touch-icon" href="icon.svg">
  
  <title>Sira AI | مساعدك الذكي</title>
  
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  
  <style>
    :root {
      --bg: #0a0a0a; --surface: #111111; --card: #1a1a1a;
      --border: #2a2a2a; --border2: #333333; --accent: #8b5cf6;
      --accent2: #3b82f6; --danger: #ff3333; --text: #e0e0e0;
      --text2: #a0a0a0; --text3: #666666;
      --font: 'IBM Plex Sans Arabic', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #fff;
    }
    
    .logo-text h1 { font-size: 18px; font-weight: 700; color: var(--text); }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .header-btn {
      width: 40px; height: 40px;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 10px;
      color: var(--text2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 16px;
    }
    
    .header-btn:hover { border-color: var(--accent); color: var(--accent); }
    
    .api-status {
      display: flex; align-items: center; gap: 6px;
      padding: 4px 10px; background: var(--card); border-radius: 20px;
      font-size: 11px; color: #00ff00;
    }
    
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    
    .message {
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s ease;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .message-avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    
    .message.user .message-avatar { background: var(--accent2); color: white; }
    .message.assistant .message-avatar { background: var(--accent); color: white; }
    
    .message-content { flex: 1; min-width: 0; }
    
    .message-header {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    
    .message-name { font-weight: 600; font-size: 14px; }
    .message-time { font-size: 11px; color: var(--text3); }
    
    .message-text {
      color: var(--text);
      line-height: 1.7;
      font-size: 15px;
    }
    
    .message-text pre {
      background: #000;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 13px;
      border: 1px solid var(--border);
      margin: 12px 0;
    }
    
    .message-text code {
      font-family: var(--font-mono);
      background: var(--surface);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .message-text pre code { background: none; padding: 0; }
    
    .input-area {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    
    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 10px 16px;
    }
    
    .input-wrapper textarea {
      flex: 1;
      background: none;
      border: none;
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
    }
    
    .input-wrapper textarea::placeholder { color: var(--text3); }
    
    .input-wrapper button {
      width: 44px; height: 44px;
      background: var(--accent);
      border: none;
      border-radius: 15px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    
    .input-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; }
    
    .typing-indicator {
      display: flex; gap: 4px; padding: 8px 0;
    }
    
    .typing-indicator span {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text3);
    }
    
    .empty-state i { font-size: 48px; margin-bottom: 15px; color: var(--accent); opacity: 0.5; }
    
    .api-key-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .api-key-screen.hidden { display: none; }
    
    .api-key-card {
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    
    .api-key-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 36px;
      margin: 0 auto 24px;
      color: #fff;
    }
    
    .api-key-card h2 {
      font-size: 1.5rem; font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    .api-key-card p {
      color: var(--text2);
      font-size: 0.9rem;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    
    .api-key-card a { color: var(--accent); text-decoration: none; }
    
    .api-key-input {
      width: 100%;
      padding: 16px;
      background: var(--card);
      border: 1.5px solid var(--border2);
      border-radius: 16px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 14px;
      text-align: center;
      outline: none;
      margin-bottom: 20px;
      direction: ltr;
    }
    
    .api-key-input:focus { border-color: var(--accent); }
    
    .api-key-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 16px;
      color: #fff;
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .api-key-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.3);
    }
    
    .api-key-note {
      margin-top: 16px;
      color: var(--text3);
      font-size: 0.8rem;
    }
    
    .api-key-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <!-- شاشة إدخال API Key -->
  <div class="api-key-screen" id="apiKeyScreen">
    <div class="api-key-card">
      <div class="api-key-icon"><i class="fa-solid fa-key"></i></div>
      <h2>أدخل مفتاح Gemini API</h2>
      <p>للحصول على مفتاح مجاني، سجل في <a href="https://aistudio.google.com" target="_blank">Google AI Studio</a></p>
      <input type="password" class="api-key-input" id="apiKeyInput" placeholder="AIza...">
      <button class="api-key-btn" id="saveApiKeyBtn"><i class="fa-solid fa-check"></i> حفظ المفتاح</button>
      <p class="api-key-note">🔒 المفتاح يُحفظ في جهازك فقط.</p>
      <div class="api-key-error" id="apiKeyError"></div>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div class="app-header">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-brain"></i></div>
      <div class="logo-text">
        <h1>Sira AI</h1>
        <div class="api-status" id="apiStatus">
          <i class="fa-solid fa-circle"></i> <span id="apiStatusText">متصل</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="changeApiKeyBtn" title="تغيير المفتاح"><i class="fa-solid fa-key"></i></button>
      <button class="header-btn" onclick="clearChat()"><i class="fa-regular fa-trash-can"></i></button>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="empty-state">
      <i class="fa-solid fa-message"></i>
      <h3>Sira AI</h3>
      <p>كيف أقدر أساعدك اليوم؟</p>
    </div>
  </div>

  <div class="input-area">
    <div class="input-wrapper">
      <textarea id="messageInput" placeholder="اكتب رسالتك..." rows="1"></textarea>
      <button id="sendBtn"><i class="fa-solid fa-arrow-up"></i></button>
    </div>
  </div>

  <script>
    // ========== إدارة API Key ==========
    const API_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';
    let API_KEY = localStorage.getItem('sira_gemini_key') || '';
    
    const apiKeyScreen = document.getElementById('apiKeyScreen');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
    const apiKeyError = document.getElementById('apiKeyError');
    const changeApiKeyBtn = document.getElementById('changeApiKeyBtn');
    const apiStatus = document.getElementById('apiStatusText');
    
    function showApiKeyScreen() {
      apiKeyScreen.classList.remove('hidden');
      apiKeyInput.value = '';
      apiKeyError.textContent = '';
    }
    
    function hideApiKeyScreen() {
      apiKeyScreen.classList.add('hidden');
    }
    
    function updateApiStatus() {
      if (API_KEY) {
        apiStatus.textContent = 'متصل';
        apiStatus.parentElement.style.color = '#00ff00';
      } else {
        apiStatus.textContent = 'غير متصل';
        apiStatus.parentElement.style.color = '#ff3333';
      }
    }
    
    async function validateApiKey(key) {
      try {
        const response = await fetch(`${API_URL}?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: 'Say hello' }] }]
          })
        });
        return response.ok;
      } catch {
        return false;
      }
    }
    
    saveApiKeyBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      
      if (!key) { apiKeyError.textContent = 'الرجاء إدخال المفتاح'; return; }
      
      saveApiKeyBtn.innerHTML = '<i class="fa-solid fa-spinner fa-pulse"></i> جاري التحقق...';
      saveApiKeyBtn.disabled = true;
      
      const isValid = await validateApiKey(key);
      
      if (isValid) {
        API_KEY = key;
        localStorage.setItem('sira_gemini_key', key);
        hideApiKeyScreen();
        updateApiStatus();
        addMessage('assistant', '✅ تم الاتصال بنجاح! أنا Sira AI، كيف أقدر أساعدك؟');
      } else {
        apiKeyError.textContent = 'المفتاح غير صالح';
      }
      
      saveApiKeyBtn.innerHTML = '<i class="fa-solid fa-check"></i> حفظ المفتاح';
      saveApiKeyBtn.disabled = false;
    });
    
    changeApiKeyBtn.addEventListener('click', showApiKeyScreen);
    
    // ========== المحادثة ==========
    const chatContainer = document.getElementById('chatContainer');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let messages = [];
    let isLoading = false;

    marked.setOptions({ breaks: true, gfm: true });
    
    function renderMarkdown(text) {
      return marked.parse(text);
    }

    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      
      const time = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
      const avatar = role === 'user' ? '<i class="fa-regular fa-user"></i>' : '<i class="fa-solid fa-brain"></i>';
      const name = role === 'user' ? 'أنت' : 'Sira AI';
      
      messageDiv.innerHTML = `
        <div class="message-avatar">${avatar}</div>
        <div class="message-content">
          <div class="message-header"><span class="message-name">${name}</span><span class="message-time">${time}</span></div>
          <div class="message-text">${role === 'assistant' ? renderMarkdown(content) : content}</div>
        </div>
      `;
      
      document.querySelector('.empty-state')?.remove();
      chatContainer.appendChild(messageDiv);
      
      if (role === 'assistant') {
        messageDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
      }
      
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return messageDiv;
    }

    function addTypingIndicator() {
      const indicator = document.createElement('div');
      indicator.className = 'message assistant';
      indicator.id = 'typingIndicator';
      indicator.innerHTML = `
        <div class="message-avatar"><i class="fa-solid fa-brain"></i></div>
        <div class="message-content">
          <div class="message-header"><span class="message-name">Sira AI</span></div>
          <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
      `;
      chatContainer.appendChild(indicator);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function removeTypingIndicator() {
      document.getElementById('typingIndicator')?.remove();
    }

    async function sendMessage() {
      const content = messageInput.value.trim();
      if (!content || isLoading) return;
      
      if (!API_KEY) { showApiKeyScreen(); return; }
      
      messageInput.value = '';
      messageInput.style.height = 'auto';
      sendBtn.disabled = true;
      isLoading = true;
      
      document.querySelector('.empty-state')?.remove();
      addMessage('user', content);
      messages.push({ role: 'user', content });
      addTypingIndicator();
      
      try {
        // بناء المحادثة كاملة
        const conversationText = `System: أنت Sira AI، مساعد ذكي ومفيد. أجب باللغة العربية دائماً. كن ودوداً ومختصراً.\n\n` +
          messages.map(m => `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.content}`).join('\n') +
          `\nAssistant: `;
        
        const response = await fetch(`${API_URL}?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: conversationText }] }],
            generationConfig: { maxOutputTokens: 1000, temperature: 0.7 }
          })
        });
        
        const data = await response.json();
        removeTypingIndicator();
        
        if (data.candidates && data.candidates[0]) {
          const reply = data.candidates[0].content.parts[0].text;
          addMessage('assistant', reply);
          messages.push({ role: 'assistant', content: reply });
        } else {
          addMessage('assistant', '⚠️ عذراً، حدث خطأ. تأكد من المفتاح.');
        }
      } catch (error) {
        removeTypingIndicator();
        addMessage('assistant', 'عذراً، تعذر الاتصال بالخادم.');
      }
      
      isLoading = false;
      sendBtn.disabled = false;
      messageInput.focus();
    }

    function clearChat() {
      messages = [];
      chatContainer.innerHTML = `<div class="empty-state"><i class="fa-solid fa-message"></i><h3>Sira AI</h3><p>كيف أقدر أساعدك اليوم؟</p></div>`;
    }

    messageInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    
    sendBtn.addEventListener('click', sendMessage);
    
    // ========== بدء التشغيل ==========
    updateApiStatus();
    
    if (API_KEY) {
      hideApiKeyScreen();
      addMessage('assistant', '👋 مرحباً! أنا Sira AI مع Gemini، كيف أقدر أساعدك اليوم؟');
    } else {
      showApiKeyScreen();
    }
    
    // ========== PWA ==========
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
